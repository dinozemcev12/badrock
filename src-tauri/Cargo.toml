[package]
name = "bedrock-backend"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "bedrock-backend"
path = "main.rs"

[dependencies]
tauri = { version = "1", features = ["api-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
regex = "1"

[build-dependencies]
tauri-build = { version = "1" }
