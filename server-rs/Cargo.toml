[package]
name = "bedrock-server"
version = "1.0.0"
edition = "2021"
description = "Bedrock Notes — local-first Markdown notes server (Rust)"

[[bin]]
name = "bedrock-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "=1.43.0", features = ["rt-multi-thread", "macros", "net", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
percent-encoding = "2"
tao = "0.16"
wry = "0.24"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
